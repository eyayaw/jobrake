version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv # uv.toml's exclude-newer already holds back fresh releases
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

[project]
name = "jobrake"
version = "0.10.0"
description = "The job boards shed new postings every day. Bring a rake."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Eyayaw Beze" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12",
]

[project.urls]
Repository = "https://github.com/eyayaw/jobrake"
Changelog = "https://github.com/eyayaw/jobrake/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.3",
    "ty>=0.0.71",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv_build.targets.wheel]
packages = ["src/jobrake"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4", # pycodestyle: import placement (one per line, at the top)
    "E7", # pycodestyle: statements (None/True comparisons, bare except, ...)
    "E9", # pycodestyle: syntax errors
    "F",  # pyflakes: undefined names, unused imports and variables
    "I",  # isort: sorted, grouped imports
]

[project.scripts]
jobrake = "jobrake.cli:main"

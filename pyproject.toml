[project]
name = "jobrake"
version = "0.1.0"
description = "Rake job postings off the boards (Indeed, LinkedIn)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Eyayaw Beze" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fetchkit==0.19.0",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
fetchkit = { git = "https://github.com/eyayaw/fetchkit" }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv_build.targets.wheel]
packages = ["src/jobrake"]

[tool.ruff]
line-length = 100
target-version = "py311"

[project.scripts]
jobrake = "jobrake.cli:main"

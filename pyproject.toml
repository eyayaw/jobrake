[project]
name = "jobrake"
version = "0.20.0"
description = "The job boards shed new postings every day. Bring a rake."
readme = "README.md"
requires-python = ">=3.15"
authors = [{ name = "Eyayaw Beze" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12",
]

[project.urls]
Repository = "https://github.com/eyayaw/jobrake"
Changelog = "https://github.com/eyayaw/jobrake/blob/main/CHANGELOG.md"

[project.scripts]
jobrake = "jobrake.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "pytest>=9.1",
    "pytest-randomly>=5",
    "ruff>=0.17",
    "ty>=0.0.86",
]
